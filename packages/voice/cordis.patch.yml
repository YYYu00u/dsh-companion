# 本地嗓子：ZipVoice 零样本克隆 + 十来段参考音频，起一个只听 127.0.0.1 的合成服务。
# 需要先跑 `npm run models`（下载 197 MB 模型）和 `npm run refs`（用自己的豆包 key 生成参考音频）。
- insert:
    - id: companion-voice
      name: '@dsh-companion/voice'
      config:
        port: 4321
        # 默认音色，留空用 voice.json 里选的、再退回清单第一个
        voice: ''
        # 选品页和 /companion-voice/api/* 挂到 DSH 上；不想要就填 false
        start: true
        # 选中的音色记在哪（默认 ~/.dsh-companion/voice.json）
        stateDir: ''
        # 8 = 质量/速度折中；16/32 更稳但更慢
        steps: 8
        # 模型目录，默认 .models/
        modelDir: ''
