# 耳朵：按一下听 15–30 秒系统声音/麦克风/音频文件。
# 默认 sherpa-onnx + SenseVoiceSmall，用的时候才起 worker；模型需要自己下。
- insert:
    - id: dsh-companion-ears
      name: '@dsh-companion/ears'
      config:
        home: ~/.dsh-companion
        # Swift/ObjC 采集程序，见 packages/ears/capture/README.md
        helper: ~/.dsh-companion/bin/EarsCapture.app/Contents/MacOS/ears-capture
        stt:
          provider: sherpa
          sherpa:
            model: ~/.dsh-companion/models/sensevoice/model.int8.onnx
            tokens: ~/.dsh-companion/models/sensevoice/tokens.txt
            threads: 2
          language: zh
        capture:
          maxSeconds: 30
          defaultSource: system
