# 耳朵：按一下听 15–30 秒系统声音/麦克风/音频文件。默认本地 whisper.cpp。
# 需要先装 whisper.cpp（或把 stt.provider 改成 assemblyai）和 Swift 采集 helper。
- insert:
    - id: dsh-companion-ears
      name: '@dsh-companion/ears'
      config:
        home: ~/.dsh-companion
        # Swift 采集程序，见 packages/ears/capture/README.md
        helper: ~/.dsh-companion/bin/EarsCapture.app/Contents/MacOS/ears-capture
        stt:
          provider: local
          binary: whisper-cli
          model: ~/.dsh-companion/models/ggml-small.bin
          language: zh
        capture:
          maxSeconds: 30
          defaultSource: system
