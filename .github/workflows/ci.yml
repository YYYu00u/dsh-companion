name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Link workspace packages
        run: node scripts/link-workspace.mjs
      - name: Check syntax, manifests, secrets, paths
        run: npm run check
      - name: Unit and smoke tests
        run: npm test
